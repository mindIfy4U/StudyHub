<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Französisch – Study Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        /* ---------- GLOBAL DARK MODE ---------- */
        :root {
            --bg: #f0f5ff;
            --text: #111827;
            --box-bg: #ffffff;
            --header-bg: #e5e7eb;
        }

        :root.dark {
            --bg: #0f172a;
            --text: #f1f5f9;
            --box-bg: #1e293b;
            --header-bg: #334155;
        }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        /* ---------- HEADER ---------- */
        header {
            background: var(--header-bg);
            color: var(--text);
            padding: 18px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: var(--text);
            margin-left: 20px;
            text-decoration: none;
            font-size: 14px;
        }

        #darkToggle {
            cursor: pointer;
            font-size: 20px;
            margin-left: 15px;
        }

        /* ---------- BANNER ---------- */
        .hero-banner img {
            width: 100%;
            display: block;
        }

        .white-space {
            height: 40px;
        }

        /* ---------- MAIN ---------- */
        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 30px 16px 40px;
        }

        /* ---------- BOXEN ---------- */
        .fancy-box {
            margin-bottom: 25px;
            border-radius: 10px;
            background: var(--box-bg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .fancy-header {
            background: linear-gradient(90deg, #f9d6e2, #ffeef3);
            color: #000;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 24px;
            border-left: 6px solid #0055a4;
            border-right: 6px solid #ef4135;
        }

        .fancy-content {
            padding: 15px;
            display: none;
        }

        /* ---------- TRAINER ---------- */
        #trainerArea input,
        #trainerArea select,
        #trainerArea button {
            padding: 10px;
            margin: 6px 0;
            width: 100%;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        #trainerArea button {
            background: #0055a4;
            color: white;
            border: none;
            cursor: pointer;
        }

        #trainerArea button:hover {
            background: #003f7d;
        }

        #score {
            font-weight: bold;
            margin-top: 10px;
        }

    </style>
</head>

<body>

<header>
    <h1>Französisch</h1>
    <nav>
        <a href="#pdf">PDF</a>
        <a href="#trainer">Trainer</a>
        <a href="#grammatik">Grammatik</a>
        <span id="darkToggle">🌙</span>
    </nav>
</header>

<div class="hero-banner">
    <img src="franzosisch.png" alt="Banner">
</div>

<div class="white-space"></div>

<main>

<!-- PDF-Bereich -->
<div class="fancy-box" id="pdf">
    <div class="fancy-header">Verbenliste (PDF)</div>
    <div class="fancy-content">
        <p>
            <a href="Franzosisch_verben_liste.pdf" target="_blank">
                📄 Verbenliste als PDF öffnen
            </a>
        </p>
    </div>
</div>

<!-- PREMIUM VERBTRAINER -->
<div class="fancy-box" id="trainer">
    <div class="fancy-header">Premium Verbtrainer</div>
    <div class="fancy-content" id="trainerArea">

        <label>Modus:</label>
        <select id="modeSelect">
            <option value="learn">Lernen</option>
            <option value="test">Testmodus</option>
        </select>

        <label>
            <input type="checkbox" id="showTranslation" checked>
            Übersetzung anzeigen
        </label>

        <h3>Zeitformen</h3>
        <label><input type="checkbox" class="tense" value="present" checked> Présent</label>
        <label><input type="checkbox" class="tense" value="imparfait"> Imparfait</label>
        <label><input type="checkbox" class="tense" value="pc"> Passé composé</label>
        <label><input type="checkbox" class="tense" value="futur"> Futur simple</label>

        <h3>Personen</h3>
        <label><input type="checkbox" class="person" value="je" checked> je</label>
        <label><input type="checkbox" class="person" value="tu"> tu</label>
        <label><input type="checkbox" class="person" value="il"> il/elle/on</label>
        <label><input type="checkbox" class="person" value="nous"> nous</label>
        <label><input type="checkbox" class="person" value="vous"> vous</label>
        <label><input type="checkbox" class="person" value="ils"> ils/elles</label>

        <button id="startExercise">Start</button>

        <hr>

        <div id="exerciseArea" style="display:none;">
            <p id="question"></p>
            <input type="text" id="answerInput" placeholder="Deine Antwort...">
            <button id="checkAnswer">Prüfen</button>

            <p id="feedback"></p>
            <p id="translation"></p>
            <p id="score"></p>
        </div>

    </div>
</div>

<!-- Andere Boxen -->
<div class="fancy-box" id="grammatik">
    <div class="fancy-header">Grammatik – COI & COD</div>
    <div class="fancy-content">
        <p>Hier kommen später COI/COD-Erklärungen rein.</p>
    </div>
</div>

</main>

<script src="verbs.js"></script>
<script src="trainer.js"></script>

<script>
/* Aufklappboxen */
document.querySelectorAll(".fancy-header").forEach(header => {
    header.addEventListener("click", () => {
        const content = header.nextElementSibling;
        content.style.display =
            content.style.display === "block" ? "none" : "block";
    });
});

/* ---------- GLOBAL DARK MODE ---------- */
const toggle = document.getElementById("darkToggle");

/* Manuelles Umschalten */
toggle.addEventListener("click", () => {
    document.documentElement.classList.toggle("dark");
    toggle.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
});

/* Automatischer Dark Mode */
if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
    document.documentElement.classList.add("dark");
    toggle.textContent = "☀️";
}
</script>

</body>
</html>
